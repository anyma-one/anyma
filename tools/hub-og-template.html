<!doctype html>
<!-- Source of apps/hub/assets/og-image.jpg (the start screen's link preview). Not part of the
     site. To re-render: copy it to dist/_og/og.html while the local dev server runs (port 8100),
     open it at 1200x630 and screenshot as JPEG quality 88 (headless Chrome --screenshot
     --window-size=1200,630, then sips -s format jpeg -s formatOptions 88). Uses the hub's own stylesheet. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  html { background: var(--grain-black), radial-gradient(1500px 900px at 50% -10%, #ffffff 0%, #fefefd 55%, #f4f4f2 100%); }
  .og { width: 1200px; height: 630px; box-sizing: border-box; padding: 0 80px; justify-content: center;
        display: flex; flex-direction: column; align-items: center; text-align: center; }
  .og .logo { height: 96px; margin: -30px 0 -26px; align-self: center; }
  .og .h1 { font-size: 60px; line-height: 1.1; margin-top: 30px; }
  .og .lede { font-size: 20px; max-width: 760px; margin-top: 14px; }
  .og .row { margin-top: 44px; display: grid; grid-template-columns: repeat(3, 300px); gap: 36px; }
  .og .t { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .og .m { position: relative; width: 300px; aspect-ratio: 16/10; border-radius: 12px; overflow: hidden; box-shadow: var(--thumb-shadow); }
  .og .m img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .og .n { font-family: var(--font-display); font-weight: 500; font-size: 24px; letter-spacing: -0.02em; }
</style></head>
<body>
<div class="og">
  <img class="logo" src="/assets/anyma-logo.png" alt="">
  <h1 class="h1">feed the mind, nourish the soul</h1>
  <p class="lede">Learn in a playful way about ancient, esoteric and spiritual practices.</p>
  <div class="row">
    <div class="t"><div class="m"><img src="/assets/thumb-soul-800.avif"></div><span class="n">soul</span></div>
    <div class="t"><div class="m"><img src="/assets/thumb-dosha-800.avif"></div><span class="n">dosha</span></div>
    <div class="t"><div class="m"><img src="/assets/thumb-ching-800.avif"></div><span class="n">ching</span></div>
  </div>
</div>
</body></html>
