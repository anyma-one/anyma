<article style="flex:999 1 620px;min-width:0;background:linear-gradient(172deg,#F6EDDB,#E6D8BC);color:#191411;border-radius:3px;box-shadow:0 32px 84px rgba(0,0,0,.6);padding:clamp(26px,5vw,56px) clamp(20px,5vw,60px);display:flex;flex-direction:column;gap:18px">

<sc-if value="{{ b.is_ol }}" hint-placeholder-val="{{ false }}"><ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;max-width:62ch;font-size:18px;line-height:1.6;color:#3D3226"><sc-for list="{{ b.items }}" as="it"><li style="display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7E100E;padding-top:5px">{{ it.num }}</span><span><sc-for list="{{ it.segs }}" as="g"><sc-if value="{{ g.plain }}"><span>{{ g.t }}</span></sc-if><sc-if value="{{ g.b }}"><strong style="color:#191411;font-weight:600">{{ g.t }}</strong></sc-if><sc-if value="{{ g.i }}"><em>{{ g.t }}</em></sc-if></sc-for></span></li></sc-for></ol></sc-if>
<sc-if value="{{ b.is_table }}" hint-placeholder-val="{{ false }}">
<div role="region" aria-label="Table, scrolls sideways on small screens" tabindex="0" style="overflow-x:auto;margin:6px 0;border:1px solid #C7B694;border-radius:3px;background:rgba(246,237,219,.6)">
<table style="border-collapse:collapse;width:100%;min-width:{{ b.minW }}px;font-size:16px;line-height:1.4">
<thead><tr><sc-for list="{{ b.head }}" as="h"><th scope="col" style="text-align:left;padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:400;color:#7E100E;border-bottom:1px solid #C7B694;white-space:nowrap;background:#EFE3CA"><sc-for list="{{ h.segs }}" as="g"><span>{{ g.t }}</span></sc-for></th></sc-for></tr></thead>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"page":{"editor":"int","default":2,"min":1,"max":8,"section":"Learn"}}'>
const D = {"COPY":{"levels":[{"tier":1,"name":"Quick Cast","description":"A first glimpse of your hexagram."},{"tier":2,"name":"Deep Cast","description":"Cast it yourself and learn to read."},{"tier":3,"name":"Full Cast","description":"The whole story of your cast, read with you."}],"question":{"heading":"What would you like to understand?","threshold":"Traditionally, the I Ching was consulted rarely, and for things that mattered. Take a moment with your question before you cast.","placeholder":"Describe your situation and what you'd like to understand about it","guidance":["Ask about something that genuinely matters to you right now.","Open questions work best: \"What should I understand about...\" or \"How can I approach...\"","Name the situation, not just the outcome you hope for.","One question per cast. If you have two, cast twice."],"yesNoNotice":{"trigger":"The question starts with a yes/no opener (Will, Should, Is, Are, Can, Do, Does).","text":"The I Ching doesn't answer yes or no. It describes the situation you're in and the stance it asks of you: to move, to wait, to yield, to persist. You can keep your question as it is, or open it up a little.","example":"Instead of \"Should I take the job?\", try \"What should I understand about taking this job?\"","keep":"Keep my question","rephrase":"Rephrase it"}},"recast":{"trigger":"The user casts the same (or a near-identical) question again in the same session.","text":"You've asked this before. Tradition holds that asking again because you didn't like the answer means you've stopped listening; Hexagram 4 says so plainly. But if you're practicing the method, cast as often as you like: that's how the skill is learned. If you're hoping for a different answer, try staying with the first one a little longer.","castAnyway":"Cast again","goBack":"Return to my first reading"},"tier1":{"honestFrame":"This is the traditional text: evocative, a little cryptic, and the same for everyone who receives this hexagram. Learning to read it for your own question is what Deep Cast is for.","cta":"Continue with Deep Cast"},"tier2":{"secondHexagramTeaser":"Your cast is moving toward {glyph} {name}. Where this change is taking you, and what it means for your question, opens in Full Cast.","secondHexagramCta":"Sign up for Full Cast","reflectionsHeading":"Read it against your question","selfReadingNote":"If the reading suddenly seems to fit your situation, notice that: you just made the connection. That's your mind doing the reading, which is the skill this practice builds."},"changingLines":{"zero":{"tier2":"No lines are changing in your cast. That makes this a still hexagram: one settled picture rather than a situation in motion. There's no second hexagram this time, so the whole message lives here. The Meaning below is your reading.","tier3":"Nothing is changing, so there's no second hexagram to move toward. Read all six lines anyway, from the bottom up, as the full arc of this hexagram's story. None is highlighted, because none is transforming; the value here is watching the theme build from its first stage to its last."},"one":{"tier2":"One line in your cast is changing. That single line is the most specific note in your reading, and it's enough on its own to turn this cast into a second hexagram, a glimpse of where things are heading. Read the changing line below.","tier3":"One line is changing, highlighted below. Read all six lines, but let the highlighted one carry the weight. It's the crucial element that turns this cast into the second hexagram shown here."},"several":{"tier2":"Your cast has {count} changing lines. Together they tell a fuller story, and they reveal a second hexagram: where this situation is heading as it transforms. Read the changing lines below, from the bottom up.","tier3":"Your cast has {count} changing lines, highlighted below. Read all six as one arc and watch the highlighted ones: they're the moving parts carrying this hexagram into the second. The first hexagram is where you are; the second is where the change is taking you."},"all":{"tier2":"All six lines are changing. This is rare, about one cast in four thousand, and it means the whole situation is in motion: everything about it is turning into something else. Tradition reads a cast like this mostly through the second hexagram.","tier2_hex1_2":"All six lines are changing. This is rare, about one cast in four thousand. Hexagrams 1 and 2 are the only ones with a special text for this case, and yours is one of them. Read it below.","tier3":"All six lines are changing, so the reading passes almost entirely to the second hexagram. Read your first hexagram as where you're coming from and the second as where you're going; the second carries the weight.","tier3_hex1_2":"All six lines are changing. For this hexagram, tradition adds a seventh text for exactly this case. Read it alongside the second hexagram, which carries the weight of the reading."}},"lineTypes":{"intro":"Each toss of three coins gives one line. Heads count 3, tails count 2. The total is always 6, 7, 8 or 9, and each number is a different kind of line.","convention":"Some traditions count heads as 2 and tails as 3. Either works, as long as you stay with one convention.","6":{"name":"Old yin","coins":"Three tails (2 + 2 + 2)","draw":"Broken line, marked as changing","text":"A yielding line at its limit. It's about to turn into its opposite, so it changes into a solid line in the second hexagram.","odds":"1 in 8"},"7":{"name":"Young yang","coins":"Two tails, one head (2 + 2 + 3)","draw":"Solid line","text":"A firm line that's stable for now. It stays as it is.","odds":"3 in 8"},"8":{"name":"Young yin","coins":"Two heads, one tail (3 + 3 + 2)","draw":"Broken line","text":"A yielding line that's stable for now. It stays as it is.","odds":"3 in 8"},"9":{"name":"Old yang","coins":"Three heads (3 + 3 + 3)","draw":"Solid line, marked as changing","text":"A firm line at its limit. It's about to turn into its opposite, so it changes into a broken line in the second hexagram.","odds":"1 in 8"},"whyUneven":"Only one combination of coins gives three tails, and only one gives three heads, but three different combinations give each of the mixed results. That's why changing lines are rarer: each line has a 1 in 4 chance of changing, so most casts have one or two."},"landing":{"eyebrow":"anyma · ching","headline":"Learn to cast and read the I Ching","subhead":"A three-thousand-year-old book about change, taught one real question at a time. No belief required: just curiosity, and a question that matters to you.","levelsHeading":"How deep do you want to go?","learnLink":"New to the I Ching? Start with a short history."},"cast":{"progress":"Line {n} of 6","buildNote":"A hexagram is built from the bottom up, one line per toss.","beforeReveal":"Your hexagram","skip":"Skip to my reading","changingMark":"This line is changing."},"guide":{"intro":"You'll toss three coins six times. Each toss gives one line, and you'll work out which line it is. By the end, you'll have cast a hexagram yourself.","toss":"Toss the coins","tossAgain":"Toss for line {n}","askTotal":"What do these coins add up to?","firstHint":"Heads count 3, tails count 2. Add up all three coins.","hintButton":"Show me how","correct":"That's right.","incorrect":"Not quite. Heads count 3 and tails count 2, so these coins add up to {total}.","lineIs":"A total of {total} is {type}.","firstChanging":"This is a changing line. It's at its limit and will turn into its opposite. Changing lines are the most specific part of your reading.","complete":"Six lines, six tosses. You've cast a hexagram.","findIntro":"Every hexagram is two trigrams stacked. Can you find yours?","findLower":"Which trigram is formed by your bottom three lines?","findUpper":"And the top three?","findSkip":"Skip this step","found":"Together they make hexagram {number}."},"gate":{"heading":"See The Whole Story of Your Cast","body":"Full Cast reveals where your cast is heading: the second hexagram and its Meaning, all six lines with your changing lines marked, and a conversation that helps you apply the reading to your own question.","payment":"A one-time payment of {price} keeps the server running.","cta":"Unlock Full Cast","keep":"Your reading stays right here.","noSecond":"Your cast has no changing lines, so there's no second hexagram. Full Cast still gives you all six lines as one story, and a conversation about your reading."},"dialogue":{"heading":"Make It Yours","intro":"Ask about your reading, or tell me more about your situation. I'll stay close to the texts and won't simply tell you what you want to hear.","placeholder":"Ask about your reading","starters":["What does the changing line mean for my question?","How do the two hexagrams relate?","What am I not seeing here?"]},"errors":{"generic":"Something went wrong. Your reading is safe; please try again.","dialogueUnavailable":"The conversation isn't available right now. Your reading is still here, and you can come back to it."},"resources":{"heading":"Learn","pages":[{"file":"01-history.md","title":"A brief history"},{"file":"02-gua-table.md","title":"The 64 hexagrams"},{"file":"03-trigrams.md","title":"The eight trigrams"},{"file":"04-how-to-cast.md","title":"How to cast"},{"file":"05-how-to-read.md","title":"How to read"},{"file":"06-on-translation.md","title":"On translation"},{"file":"07-why-divination.md","title":"Why divination can help"}]}},"RES":[{"file":"01-history.md","title":"A Brief History","blocks":[{"k":"h1","segs":[{"t":"A Brief History of The I Ching","b":false,"i":false,"href":"","plain":true}],"is_h1":true,"is_h2":false,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The I Ching, or ","b":false,"i":false,"href":"","plain":true},{"t":"Yijing","i":true,"b":false,"href":"","plain":false},{"t":" (易經), means \"the Classic of Changes.\" It is one of the oldest books still in use anywhere, and for most of its life it has been two things at once: a manual for divination and a book of philosophy. Both matter for understanding how to use it well.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Before The Book: Cracks in Bone","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Long before the I Ching existed, the kings of the Shang dynasty (roughly 1600 to 1046 BCE) consulted their ancestors by heating ox bones and turtle shells until they cracked, then reading the cracks. Specialists recorded the question and the answer on the bone itself. More than a hundred thousand fragments of these \"oracle bones\" survive, and they contain the earliest Chinese writing we have.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The Zhou, who overthrew the Shang, came to favor a different method. Alongside fire, they used bundles of yarrow stalks, sorted and counted to produce numbers, and the numbers produced lines. That system of lines, and the texts written to interpret them, became the ","b":false,"i":false,"href":"","plain":true},{"t":"Zhouyi","i":true,"b":false,"href":"","plain":false},{"t":": the Changes of Zhou.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"The Core Text","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The core of the I Ching is short: 64 figures of six lines each, a brief statement for each figure (the Judgment), and a brief statement for each of its six lines. That's all. Everything else came later.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Tradition gives this text a heroic origin. The legendary sage Fu Xi is said to have discovered the eight trigrams by observing the patterns of nature. King Wen, whose son would found the Zhou dynasty, is said to have arranged the 64 hexagrams and written the Judgments while imprisoned by the last Shang king. His son, the Duke of Zhou, is said to have written the line statements.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Modern scholars see it differently. The core text was most likely compiled during the Western Zhou, around the 9th century BCE, from older divination records and sayings. That's why so many lines refer to concrete things: hunts, river crossings, marriages, sacrifices, military campaigns. They read like notes from real consultations, polished into a reference work.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"The Ten Wings","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Over the following centuries, a set of commentaries grew around the core text. Tradition attributes them to Confucius; scholars date them to roughly the 4th to 2nd centuries BCE. They are called the Ten Wings, and they did something remarkable: they turned a diviner's handbook into a work of philosophy. The Image texts you read in this app come from one of these Wings. So does the idea that the 64 hexagrams describe the patterns of change running through all of nature and human life.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"How It Was Actually Used","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Historical records, above all the ","b":false,"i":false,"href":"","plain":true},{"t":"Zuo zhuan","i":true,"b":false,"href":"","plain":false},{"t":" (a chronicle of the 8th to 5th centuries BCE), describe consultations of the Changes for weighty matters: whether to go to war, whether a marriage alliance would prosper, what the future held for a ruler's newborn heir. These were rare events, prepared for carefully and taken seriously.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Even then, the wisest users treated the text as a prompt for judgment rather than a replacement for it. The philosopher Xunzi (3rd century BCE) put it in a single line: those who truly understand the Changes do not need to divine. The point of practice was to absorb the book's way of seeing until you could read situations without casting at all.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Survival and Authority","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"When the first emperor of Qin ordered the burning of books in 213 BCE, the I Ching was spared because it was classed as a practical divination manual. Under the Han dynasty it became one of the Five Classics, the core of the education every scholar and official received, and it stayed there for two thousand years.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Later thinkers kept reinterpreting it. Wang Bi (3rd century CE) read it as philosophy and set aside much of the numerology. Shao Yong (11th century) arranged the hexagrams into a perfect binary sequence. Zhu Xi (12th century) restored its role as a divination text and wrote down rules for casting that many people still follow.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"In 1973, archaeologists opening a tomb at Mawangdui, sealed in 168 BCE, found the oldest complete copy of the text, written on silk. Its hexagrams are arranged in a completely different order from the received version, a reminder that even the book's structure has a history.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Arrival in The West","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Jesuit missionaries brought the I Ching to Europe in the 17th century. In 1703 the philosopher Gottfried Wilhelm Leibniz noticed that its solid and broken lines matched the binary numbers he had been working with. James Legge published a scholarly English translation in 1882. Richard Wilhelm's German translation of 1924, put into English by Cary F. Baynes in 1950 with a foreword by Carl Jung, became the version most Western readers know. Alfred Huang's ","b":false,"i":false,"href":"","plain":true},{"t":"The Complete I Ching","i":true,"b":false,"href":"","plain":false},{"t":" (1998), whose names this app uses, brought a native Chinese perspective to the English-speaking world.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Why This Matters for You","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t" se,"i":false,"href":"","plain":true}],"num":"4"},{"segs":[{"t":"Fire","b":true,"i":false,"href":"","plain":false},{"t":" has an open line in the middle, between two solid ones: bright on the outside, empty at the center, like a flame that needs something to cling to.","b":false,"i":false,"href":"","plain":true}],"num":"5"},{"segs":[{"t":"Wind","b":true,"i":false,"href":"","plain":false},{"t":" has one open line at the bottom under two solid ones: something soft that slips in underneath and penetrates.","b":false,"i":false,"href":"","plain":true}],"num":"6"},{"segs":[{"t":"Lake","b":true,"i":false,"href":"","plain":false},{"t":" has one open line on top over two solid ones: a calm, open surface over depth.","b":false,"i":false,"href":"","plain":true}],"num":"7"}],"is_h1":false,"is_h2":false,"is_p":false,"is_table":false,"is_ul":true,"is_ol":false},{"k":"h2","segs":[{"t":"The Family","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Tradition pictures the eight as a family. Heaven and Earth are the parents. The other six are their children, and the rule is simple: a trigram takes its gender from its one line that differs from the other two. One solid line among broken ones makes a son; one broken line among solid ones makes a daughter. The position of that line gives the birth order: at the bottom, the eldest; in the middle, the middle child; on top, the youngest.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"This is an old cosmological picture, not a statement about how families or genders should be. It's useful as a memory aid, and it shows how the system thinks: in relationships, not isolated things.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"How Trigrams Make a Hexagram","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"A hexagram is one trigram placed on top of another. The lower trigram (lines 1 to 3) is called the inner trigram, and it often describes what's happening within you or at the root of the situation. The upper trigram (lines 4 to 6) is the outer trigram, describing what's around you or what's emerging.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Take Hexagram 3, Beginning: Water over Thunder. Thunder below is energy stirring; Water above is danger and difficulty. Put them together and you get the hexagram's picture: new life pushing up into a dangerous, tangled situation. Every Image text is built exactly this way, by reading the relationship between the two trigrams.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Eight trigrams below, eight above: 8 × 8 = 64. That's why there are 64 hexagrams, no more and no fewer.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Two Arrangements","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"You'll often see the trigrams arranged in a circle. There are two traditional circles. The \"Earlier Heaven\" arrangement, attributed to Fu Xi, sets opposites facing each other: Heaven across from Earth, Fire across from Water. The \"Later Heaven\" arrangement, attributed to King Wen, follows the seasons and the compass. The second is the one used in feng shui and in the directions the I Ching text sometimes mentions, such as \"friends in the southwest.\"","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false}]},{"file":"04-how-to-cast.md","title":"How to Cast","blocks":[{"k":"h1","segs":[{"t":"How to Cast with Coins","b":false,"i":false,"href":"","plain":true}],"is_h1":true,"is_h2":false,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Casting builds a hexagram one line at a time, from the bottom up, with three coins. It takes about five minutes. The method is simple; what takes practice is the attention you bring to it.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"What You Need","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"ul","items":[{"segs":[{"t":"Three coins of the same kind. Any coins work.","b":false,"i":false,"href":"","plain":true}],"num":"1"},{"segs":[{"t":"Something to write with.","b":false,"i":false,"href":"","plain":true}],"num":"2"},{"segs":[{"t":"A question you've taken a moment to think about. (See \"Asking a good question\" below.)","b":false,"i":false,"href":"","plain":true}],"num":"3"}],"is_h1":false,"is_h2":false,"is_p":false,"is_table":false,"is_ul":true,"is_ol":false},{"k":"h2","segs":[{"t":"The Steps","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"1. Decide which side counts as what.","b":true,"i":false,"href":"","plain":false},{"t":" The usual convention: heads count 3, tails count 2. Some traditions reverse this. Either is fine, as long as you stay with one.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"2. Toss all three coins and add them up.","b":true,"i":false,"href":"","plain":false},{"t":" The total is always 6, 7, 8 or 9.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"table","head":[{"segs":[{"t":"Coins","b":false,"i":false,"href":"","plain":true}]},{"segs":[{"t":"Total","b":false,"i":false,"href":"","plain":true}]},{"segs":[{"t":"Line","b":false,"i":false,"href":"","plain":true}]},{"segs":[{"t":"Draw it as","b":false,"i":false,"href":"","plain":true}]}],"rows":[{"cells":[{"segs":[{"t":"Three tails","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"6","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Old yin","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"⚋ broken, marked as changing (often with an ×)","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"Two tails, one head","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"7","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Young yang","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"⚊ solid","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"Two heads, one tail","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"8","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Young yin","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"⚋ broken","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"Three heads","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"9","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Old yang","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"⚊ solid, marked as changing (often with a ○)","b":false,"i":false,"href":"","plain":true}],"first":false}]}],"wide":false,"is_h1":false,"is_h2":false,"is_p":false,"is_table":true,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"3. Draw the line at the bottom.","b":true,"i":false,"href":"","plain":false},{"t":" Your first toss is line 1, the lowest line of the hexagram.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"4. Repeat five more times,","b":true,"i":false,"href":"","plain":false},{"t":" drawing each new line above the last. After six tosses you have a hexagram.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"5. Find your hexagram.","b":true,"i":false,"href":"","plain":false},{"t":" Split it into two trigrams: lines 1 to 3 are the lower trigram, lines 4 to 6 the upper. Look up the pair in the hexagram table.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"6. If any lines are changing, find your second hexagram.","b":true,"i":false,"href":"","plain":false},{"t":" Redraw the hexagram, flipping every changing line into its opposite: old yin becomes solid, old yang becomes broken. Leave the stable lines as they are. The new figure is your second hexagram, showing where the situation is heading.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Why Some Results Are Rarer Than Others","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"You might expect each of the four line types to come up a quarter of the time. They don't. Three tails can happen only one way, and so can three heads. But a mixed result can happen three ways: the odd coin out can be the first, the second or the third. So:","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"ul","items":[{"segs":[{"t":"Old yin (6): 1 in 8","b":false,"i":false,"href":"","plain":true}],"num":"1"},{"segs":[{"t":"Young yang (7): 3 in 8","b":false,"i":false,"href":"","plain":true}],"num":"2"},{"segs":[{"t":"Young yin (8): 3 in 8","b":false,"i":false,"href":"","plain":true}],"num":"3"},{"segs":[{"t":"Old yang (9): 1 in 8","b":false,"i":false,"href":"","plain":true}],"num":"4"}],"is_h1":false,"is_h2":false,"is_p":false,"is_table":false,"is_ul":true,"is_ol":false},{"k":"p","segs":[{"t":"Each line has a 1 in 4 chance of changing. Most casts have one or two changing lines. About one cast in six has none, and all six changing happens about once in four thousand casts.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"This matters. If a program picked line types at random with equal odds, changing lines would come up twice as often as they should, and readings would be full of movement that the real method doesn't produce. This app simulates three real coins for exactly that reason.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"The Older Method: Yarrow Stalks","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The original method used 50 yarrow stalks, divided and counted in a slow ritual that takes twenty minutes or more. It also produces 6, 7, 8 and 9, but with different odds: old yin 1 in 16, young yang 5 in 16, young yin 7 in 16, old yang 3 in 16. Notice that the yarrow method is lopsided: old yang comes up three times as often as old yin, so solid lines change far more readily than broken ones. The coin method, a later shortcut, evens this out. Some practitioners prefer yarrow because of this imbalance, and for its slowness, which gives the question time to settle.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Asking a Good Question","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The I Ching doesn't answer yes or no. It describes the situation you're in and the stance it asks of you. So open questions work best:","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"ul","items":[{"segs":[{"t":"Instead of \"Will I get the job?\", ask \"What should I understand about this job search?\"","b":false,"i":false,"href":"","plain":true}],"num":"1"},{"segs":[{"t":"Instead of \"Should I leave?\", ask \"What do I need to see about staying or leaving?\"","b":false,"i":false,"href":"","plain":true}],"num":"2"}],"is_h1":false,"is_h2":false,"is_p":false,"is_table":false,"is_ul":true,"is_ol":false},{"k":"p","segs":[{"t":"Write your question down before you cast, so you can't quietly change it afterwards to fit the answer.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Casting Again","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Tradition is strict about this: asking the same question again because you didn't like the answer means you've stopped listening. Hexagram 4 says so plainly. But practice is different. If you're learning the method, cast as often as you like; repetition is how the skill becomes yours. The line to watch is your motive: practicing, or shopping for a better answer?","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false}]},{"file":"05-how-to-read.md","title":"How to Read","blocks":[{"k":"h1","segs":[{"t":"How to Read a Hexagram","b":false,"i":false,"href":"","plain":true}],"is_h1":true,"is_h2":false,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"A reading has a few layers, and there's a natural order to them. You don't need all of them every time. Start with the big picture, then move to the parts that are specific to your cast.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"1. Return to Your Question","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Before you read anything, reread what you asked. The text is general, written for everyone who has ever received this hexagram. Your question is what makes it yours. Keep it in view the whole time.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"2. The Hexagram as a Whole","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The name","b":true,"i":false,"href":"","plain":false},{"t":" tells you the theme: Beginning, Needing, Retreat, Abundance. Sometimes it's enough on its own.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The Judgment","b":true,"i":false,"href":"","plain":false},{"t":" belongs to the oldest layer of the book and gives the core verdict on the situation. It's often terse and a little cryptic. Look for its key elements: is this favorable? What does it advise: to act, to wait, to seek help, to hold firm? Is there a condition attached?","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The Image","b":true,"i":false,"href":"","plain":false},{"t":" shows the two trigrams as a scene from nature (thunder under water, a lake on a mountain) and says how to respond to it. Where the Judgment describes the situation, the Image often describes the attitude to bring to it.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The Meaning","b":true,"i":false,"href":"","plain":false},{"t":" puts both into plain language and draws out what the hexagram asks of you.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The trigrams","b":true,"i":false,"href":"","plain":false},{"t":" are worth a glance too. The lower one often reflects what's going on within you or at the root of things; the upper one, what's around you or emerging.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"3. The Changing Lines","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"If any of your lines are changing, read their texts next, in order from the bottom up. These are the most specific part of your reading: where the hexagram as a whole describes the situation, a changing line points to your particular place in it.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Traditions differ on how to weigh several changing lines. Some follow rules set down by the scholar Zhu Xi in the 12th century, which, depending on how many lines change, point you to one line, a pair of lines, or the Judgments instead; others read them all. This app shows you all of them. If they seem to pull in different directions, that's information too: the situation may have more than one moving part.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"4. The Second Hexagram","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Changing lines transform your hexagram into a second one. A common way to read the pair: the first hexagram is where you are now; the second is where the change is taking you, or what the situation is becoming. Read its name, Judgment and Meaning, but more lightly. It's a direction, not a destination.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Special Cases","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"No changing lines.","b":true,"i":false,"href":"","plain":false},{"t":" About one cast in six. The situation is stable, a single picture rather than a story in motion. The whole message lives in the one hexagram.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"All six changing.","b":true,"i":false,"href":"","plain":false},{"t":" About one cast in four thousand. Everything is in motion; tradition reads this mostly through the second hexagram. Hexagrams 1 and 2 have a special extra text for this case.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"The Six Positions","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Each hexagram tells its theme as a story in six stages, rising from the bottom. Once you know the pattern, you'll see it everywhere.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"table","head":[{"segs":[{"t":"Line","b":false,"i":false,"href":"","plain":true}]},{"segs":[{"t":"Position","b":false,"i":false,"href":"","plain":true}]},{"segs":[{"t":"Typical character","b":false,"i":false,"href":"","plain":true}]}],"rows":[{"cells":[{"segs":[{"t":"6","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Top","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Beyond the peak. Too late, too far, overripe; sometimes the wisdom of withdrawal.","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"5","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Ruler","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"The center of the upper trigram and the place of authority. Usually the strongest position.","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"4","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Minister","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Close to power but not holding it. Needs care, tact and loyalty.","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"3","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Threshold","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"The top of the lower trigram, crossing into the upper. Often unsettled or dangerous.","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"2","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Inner center","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"The center of the lower trigram. Usually favorable: grounded, balanced, quietly effective.","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"1","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Beginning","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"The situation just starting. Often too early to act fully; a time to set foundations.","b":false,"i":false,"href":"","plain":true}],"first":false}]}],"wide":false,"is_h1":false,"is_h2":false,"is_p":false,"is_table":true,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"These are tendencies, not rules. The line texts sometimes break them, and those surprises are worth noticing.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Two more patterns the tradition uses: lines 1 and 4, 2 and 5, and 3 and 6 \"correspond,\" and a firm line paired with a yielding one in these positions is a good sign. And odd positions (1, 3, 5) suit solid lines, even positions (2, 4, 6) suit broken ones. You don't need these to read well, but you'll see older commentaries use them constantly.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Reading Well","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"ul","items":[{"segs":[{"t":"Look for the stance, not the prediction.","b":true,"i":false,"href":"","plain":false},{"t":" The I Ching rarely says what will happen. It says how to meet what's happening.","b":false,"i":false,"href":"","plain":true}],"num":"1"},{"segs":[{"t":"Notice your first reaction.","b":true,"i":false,"href":"","plain":false},{"t":" Relief, resistance, recognition: your response often tells you more than the text.","b":false,"i":false,"href":"","plain":true}],"num":"2"},{"segs":[{"t":"Write it down.","b":true,"i":false,"href":"","plain":false},{"t":" Note the date, your question, the hexagram and changing lines, and what you made of it. Rereading old casts months later is one of the best ways to learn.","b":false,"i":false,"href":"","plain":true}],"num":"3"},{"segs":[{"t":"Don't force it.","b":true,"i":false,"href":"","plain":false},{"t":" If a reading doesn't fit yet, leave it. Sometimes the connection arrives later.","b":false,"i":false,"href":"","plain":true}],"num":"4"}],"is_h1":false,"is_h2":false,"is_p":false,"is_table":false,"is_ul":true,"is_ol":false}]},{"file":"06-on-translation.md","title":"On Translation","blocks":[{"k":"h1","segs":[{"t":"On Translation","b":false,"i":false,"href":"","plain":true}],"is_h1":true,"is_h2":false,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Every English I Ching is an interpretation. That's not a flaw to apologize for; it's one of the most interesting things about the book. Seeing how translators differ teaches you more about the hexagrams than any single version can.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Gua, Not Just \"Hexagram\"","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The Chinese word for these figures is ","b":false,"i":false,"href":"","plain":true},{"t":"gua","i":true,"b":false,"href":"","plain":false},{"t":" (卦). \"Hexagram\" is a Western coinage: Greek for \"six marks.\" ","b":false,"i":false,"href":"","plain":true},{"t":"Gua","i":true,"b":false,"href":"","plain":false},{"t":" is broader. It covers both the six-line figures and the three-line trigrams, and its root sense is a divination sign, something laid out to be read. This app says \"hexagram\" for clarity, but when you read Chinese sources or older practitioners, ","b":false,"i":false,"href":"","plain":true},{"t":"gua","i":true,"b":false,"href":"","plain":false},{"t":" is the word you'll meet.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Names: Verbs or Things?","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Look at how two well-known translators name the same figures:","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"table","head":[{"segs":[{"t":"No.","b":false,"i":false,"href":"","plain":true}]},{"segs":[{"t":"Chinese","b":false,"i":false,"href":"","plain":true}]},{"segs":[{"t":"Alfred Huang","b":false,"i":false,"href":"","plain":true}]},{"segs":[{"t":"Richard Wilhelm","b":false,"i":false,"href":"","plain":true}]}],"rows":[{"cells":[{"segs":[{"t":"1","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Qián 乾","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Initiating","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"The Creative","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"2","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Kūn 坤","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Responding","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"The Receptive","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"24","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Fù 復","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Turning Back","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Return","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"29","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Kǎn 坎","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Darkness","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"The Abysmal","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"49","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Gé 革","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Abolishing the Old","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Revolution","b":false,"i":false,"href":"","plain":true}],"first":false}]},{"cells":[{"segs":[{"t":"50","b":false,"i":false,"href":"","plain":true}],"first":true},{"segs":[{"t":"Dǐng 鼎","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"Establishing the New","b":false,"i":false,"href":"","plain":true}],"first":false},{"segs":[{"t":"The Caldron","b":false,"i":false,"href":"","plain":true}],"first":false}]}],"wide":false,"is_h1":false,"is_h2":false,"is_p":false,"is_table":true,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Wilhelm tends toward nouns and archetypes: The Creative, The Receptive, The Caldron. Huang tends toward verbs and processes: Initiating, Responding, Establishing the New.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Neither is wrong. Classical Chinese doesn't mark whether a word is a noun or a verb; the same character can be either, depending on how you read it. So every translator has to choose, and the choice reveals a way of seeing. Wilhelm's names suggest timeless principles. Huang's names suggest movement, which suits a book whose very title means ","b":false,"i":false,"href":"","plain":true},{"t":"change","i":true,"b":false,"href":"","plain":false},{"t":".","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Huang isn't perfectly consistent, either: Multitude, Union, Household and Abundance are nouns. And sometimes the two agree completely, as with Keeping Still (52). This app uses Huang's names as the main ones and shows Wilhelm's as a reference, because many English readers already know Wilhelm's.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"One Character, Many Meanings","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Hexagram 50 shows how much a single character can hold. Dǐng (鼎) is a bronze cauldron used for cooking and for offerings to ancestors. Owning the great ritual cauldrons was a symbol of a dynasty's right to rule. So the hexagram is about nourishment, about sacred vessels, and about founding a lasting order, all at once. Wilhelm keeps the object (\"The Caldron\"). Huang names what it stands for (\"Establishing the New\"). Each gains something and loses something.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Hexagram 29, Kǎn (坎), means a pit or hollow, and as a trigram it stands for water. Wilhelm's \"The Abysmal\" keeps the depth; Huang's \"Darkness\" keeps the mood. A third translator might say \"The Pit\" or \"Danger.\" All of these are inside the character.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Spellings Change Too","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"James Legge's 1882 translation names Hexagram 1 \"Khien\" and Hexagram 3 \"Kun.\" These are older ways of writing Chinese sounds in the Latin alphabet. Today's standard is pinyin, which writes the same names as Qián and Zhūn. Same hexagrams, different spelling systems.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Pinyin has its own trap: several different hexagrams share a spelling and differ only in tone. Qián (1) and Qiān (15) are different words, as are Kūn (2) and Kùn (47). That's why this app always shows the tone marks and the character.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"The \"Superior Person\"","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Many Image texts describe what ","b":false,"i":false,"href":"","plain":true},{"t":"jūnzǐ","i":true,"b":false,"href":"","plain":false},{"t":" (君子) does in response to the scene. Literally, the phrase means \"a lord's son,\" a nobleman. Confucius turned it into a moral ideal: a person of noble character, whatever their birth. Legge and Wilhelm both translate it \"the superior man.\" Modern versions try \"the noble one,\" \"the wise person\" or \"the exemplary person.\"","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"This app makes a different choice and says \"you.\" The Image is advice addressed to whoever is reading, and the old phrase, however well meant, puts a distance between the reader and the advice. It's a translation decision like any other, and you're free to disagree with it.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"What This App's Texts Are","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The texts in this app are original paraphrases, written in modern English and checked for meaning against Legge's public-domain translation. They're not word-for-word translations of the Chinese. Where translators disagree about a passage, they generally follow the mainstream reading shared by Wilhelm and others. If you want to go deeper, reading Legge, Wilhelm and Huang side by side is the best next step: where all three agree, you're on firm ground; where they differ, you've found something worth thinking about.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false}]},{"file":"07-why-divination.md","title":"Why Divination Can Help","blocks":[{"k":"h1","segs":[{"t":"Why Divination Can Help","b":false,"i":false,"href":"","plain":true}],"is_h1":true,"is_h2":false,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"You don't have to believe that coins know anything about your life to get something real out of the I Ching. This page explains what's actually going on when a reading helps, and why it can help even if the coins are just coins.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Your Mind Is a Meaning-Maker","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Humans are built to find patterns and tell stories. We see faces in clouds and trends in noise, and we make sense of our lives by turning events into narratives with causes, turning points and directions. Psychologists call the tendency to see meaningful patterns in random data ","b":false,"i":false,"href":"","plain":true},{"t":"apophenia","i":true,"b":false,"href":"","plain":false},{"t":". It can mislead us, but it's also how we think.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"A reading gives that storytelling capacity a structure to work with. A hexagram offers a set of images and themes (a seed under the ground, a fox crossing a river, a well that never runs dry) and asks: does this fit what you're living through? When it does, the image lets you see your situation from an angle you didn't have before.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"The Impersonal Voice","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Advice from other people comes with baggage. If a friend tells you to leave your job, you also hear what they think of your choices, what you might owe them, whether accepting the advice means admitting they were right. Psychologists have studied this for decades. ","b":false,"i":false,"href":"","plain":true},{"t":"Reactance","i":true,"b":false,"href":"","plain":false},{"t":", first described by Jack Brehm in 1966, is the urge to push back when we feel our freedom to choose is being limited, even against good advice. Research on advice-taking also finds that people consistently give more weight to their own opinions than to others' advice, even when the advice is better.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"An oracle has no stake in your choice. It won't be disappointed in you, won't say \"I told you so,\" and doesn't need you to agree. Because the messenger is gone, a perspective can be considered on its merits. That's a real psychological advantage, and it may be one reason divination has lasted in so many cultures.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"But notice the right word here: the source is ","b":false,"i":false,"href":"","plain":true},{"t":"impersonal","i":true,"b":false,"href":"","plain":false},{"t":", not ","b":false,"i":false,"href":"","plain":true},{"t":"objective","i":true,"b":false,"href":"","plain":false},{"t":". The coins are impartial. The meaning is still made by you, the reader. That's not a weakness to hide; it's the whole point.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Why Readings Feel Personal","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"In 1948 the psychologist Bertram Forer gave his students what he said was a personality profile based on a test they had taken. Every student received the same text, assembled from horoscopes. On average, they rated it as a very accurate description of themselves. This is now called the Forer or Barnum effect: we readily recognize ourselves in general statements.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The I Ching's texts are general, too. So when a reading suddenly seems to describe your situation exactly, it's worth being honest about what's happening: you made the connection. That doesn't make the insight worthless. It means the insight came from you, prompted by the text. The skill this app teaches is doing that consciously, holding an image up against your situation and seeing what it shows you, rather than mistaking your own recognition for a message from outside.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Breaking a Stalemate","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Sometimes the hardest part of a decision is that you can't make it at all. An economist, Steven Levitt, ran an unusual experiment: people stuck on a decision, some of them major ones like quitting a job or ending a relationship, flipped a coin online to help decide. Those whom the coin told to make a change were more likely to actually do it, and six months later they reported being happier than those told to stay the course. His conclusion was that people may be too cautious when facing life-changing choices.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"The I Ching isn't a coin flip, but it can play a similar role: interrupting the loop of deliberation and giving you something outside yourself to react to. Pay attention to your reaction to a reading. Relief or disappointment can tell you what you'd already decided without admitting it.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"h2","segs":[{"t":"Curiosity, Not Blind Faith","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":true,"is_p":false,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Taking the I Ching seriously doesn't require believing it predicts the future, and this app makes no such claim. It asks you to treat a reading the way the wisest users always have: as a structured prompt for reflection, drawn from three thousand years of human thinking about change. You bring the question and the judgment. The book brings images, patterns and a way of seeing that has helped people think clearly about hard moments for a very long time.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"That's why the tradition treated consultation as rare and weighty. A reading is most useful when the question really matters to you, when you've thought about it first, and when you're willing to take the answer seriously enough to sit with it.","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"---","b":false,"i":false,"href":"","plain":true}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"p","segs":[{"t":"Sources","b":true,"i":false,"href":"","plain":false}],"is_h1":false,"is_h2":false,"is_p":true,"is_table":false,"is_ul":false,"is_ol":false},{"k":"ul","items":[{"segs":[{"t":"Brehm, J. W. (1966). ","b":false,"i":false,"href":"","plain":true},{"t":"A Theory of Psychological Reactance","i":true,"b":false,"href":"","plain":false},{"t":". Academic Press.","b":false,"i":false,"href":"","plain":true}],"num":"1"},{"segs":[{"t":"Forer, B. R. (1949). The fallacy of personal validation. ","b":false,"i":false,"href":"","plain":true},{"t":"Journal of Abnormal and Social Psychology","i":true,"b":false,"href":"","plain":false},{"t":", 44(1), 118–123.","b":false,"i":false,"href":"","plain":true}],"num":"2"},{"segs":[{"t":"Levitt, S. D. (2021). Heads or Tails: The Impact of a Coin Toss on Major Life Decisions and Subsequent Happiness. ","b":false,"i":false,"href":"","plain":true},{"t":"Review of Economic Studies","i":true,"b":false,"href":"","plain":false},{"t":", 88(1), 378–405. ","b":false,"i":false,"href":"","plain":true},{"t":"NBER working paper","href":"https://www.nber.org/papers/w22487","b":false,"i":false,"plain":false}],"num":"3"}],"is_h1":false,"is_h2":false,"is_p":false,"is_table":false,"is_ul":true,"is_ol":false}]}]};

const C = D.COPY;

const pad = (n) => String(n).padStart(2, '0');
const fill = (s, o) => String(s).replace(/\{(\w+)\}/g, (m, k) => (o[k] !== undefined ? o[k] : m));
const hexByBin = (b) => Object.values(D.HEX).find((h) => h.bin === b);
function ident(h) {
  if (!h) return null;
  const triRows = (tr) => Object.assign({}, tr, { rows: tr.bits.slice().reverse().map((x) => ({ gap: x ? 0 : 16 })) });
  const up = triRows(D.TRI[h.upper]), lo = triRows(D.TRI[h.lower]);
  const tall = h.shape === 'tall';
  return Object.assign({}, h, {
    num: pad(h.n), hasSeal: !!h.seal, noSeal: !h.seal, tall,
    sealW: 64, sealH: tall ? 119 : 64,
    sealAlt: 'Seal: ' + h.zh,
    up, lo, triLine: up.sym + ' ' + up.en + ' over ' + lo.sym + ' ' + lo.en,
  });
}
function figRows(lines, o) {
  o = Object.assign({ tone: 'dark' }, o || {});
  const col = o.tone === 'paper'
    ? { line: '#191411', ch: '#991613', empty: '#C7B694', hi: 'rgba(153,22,19,.10)', faint: '#857761' }
    : { line: '#B7884D', ch: '#991613', empty: '#5D4A3C', hi: 'rgba(153,22,19,.16)', faint: '#8B7F6B' };
  const brk = o.brk || 18;
  return lines.map((l, i) => Object.assign({ idx: i + 1 }, l)).reverse().map((l) => {
    const empty = l.state === 'empty';
    const color = l.changing && !empty ? col.ch : col.line;
    return Object.assign({}, l, {
      bar: empty ? 'background:transparent;box-shadow:inset 0 0 0 1px ' + col.empty : 'background:' + color,
      gap: empty || l.state === 'drawing' ? 0 : (l.yang ? 0 : brk),
      mark: !empty && l.changing ? (l.sum === 6 ? '×' : l.sum === 9 ? '○' : (l.yang ? '○' : '×')) : '',
      markColor: col.ch, faint: col.faint,
      opacity: l.dim ? 0.26 : 1,
      cls: (l.state === 'drawing' ? 'draw' : '') + (empty ? ' ln-empty' : (l.yang ? ' ln-yang' : ' ln-yin') + (l.changing ? ' ln-ch' : '')),
      totalTxt: l.total && !empty ? String(l.total) : '',
      hiBg: l.hi ? col.hi : 'transparent',
    });
  });
}
function figLabel(lines) {
  return 'Hexagram figure, bottom to top: ' + lines.map((l, i) => l.state === 'empty' ? ('line ' + (i + 1) + ' not cast yet') :
    ('line ' + (i + 1) + ' ' + (l.yang ? 'solid' : 'broken') + (l.changing ? ', changing' : ''))).join('; ');
}

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: (p.page ?? 2) - 1, nav: false }; }
  componentDidUpdate(prev) { if (prev.page !== this.props.page) this.setState({ i: (this.props.page ?? 2) - 1 }); }
  go(i) { this.setState({ i, nav: false }); try { window.scrollTo({ top: 0 }); } catch (e) {} }
  renderVals() {
    const i = Math.max(0, Math.min(D.RES.length - 1, this.state.i));
    const page = D.RES[i];
    const blocks = page.blocks.map((b) => {
      if (!b.is_table) return b;
      const cols = b.head.length;
      return Object.assign({}, b, {
        minW: cols > 6 ? 760 : cols > 4 ? 680 : 480,
        rows: b.rows.map((r) => ({ cells: r.cells.map((c) => Object.assign({}, c, {
          sticky: c.first ? 'position:sticky;left:0;background:#F3E8D2;font-family:\'IBM Plex Mono\',monospace;font-size:12px;white-space:nowrap' : '' })) })),
      });
    });
    return {
      pages: D.RES.map((p, k) => ({ num: pad(k + 1), title: p.title, open: () => this.go(k),
        current: k === i ? 'page' : 'false', color: k === i ? '#EBDFC7' : '#B3A78E' })),
      pageNum: pad(i + 1), blocks, pageCount: pad(D.RES.length), pageTitle: page.title,
      navCls: 'ch-lnav' + (this.state.nav ? ' open' : ''), navOpenStr: this.state.nav ? 'true' : 'false', chevRot: this.state.nav ? 'rotate(180deg)' : 'none',
      toggleNav: () => this.setState({ nav: !this.state.nav }),
      hasPrev: i > 0, hasNext: i < D.RES.length - 1,
      prevTitle: i > 0 ? D.RES[i - 1].title : '', nextTitle: i < D.RES.length - 1 ? D.RES[i + 1].title : '',
      prev: () => this.go(i - 1), next: () => this.go(i + 1),
    };
  }
}
</script>
